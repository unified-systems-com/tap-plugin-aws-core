# CI for tap-plugin-aws-core.
#
# A thin caller. All the logic lives in the reusable workflow in the core TAP repo
# (`.github/workflows/plugin-ci.yml`, req-plugin-extdev-repo-ci) so every plugin repo —
# ours and external developers' — runs the SAME admission gate, and improving it is one
# edit in one place rather than a fan-out across a dozen repos.
#
# aws_core passes `boot_profile` and opts into the boot-and-test job: it is the pilot
# for the full boot-and-suite depth leg (the incident->detection chain for the pytest-9.1
# --pyargs failure class). ci/nightly.boot.json installs aws_core ALONE, editable from
# the CI checkout (_external/aws_core) — aws_core is self-contained (all edges internal,
# boto3 the only dep), so no sibling closure is needed. The same file drives BOTH
# cadences: this push/PR caller and core's nightly-plugins depth leg (keyed on the file
# existing here). Seed-only population; CI runs with an empty secrets root and never
# fires the boto3 collector or the sacrificial-resource trial harness.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs matter for a plugin repo: core can regress the plugin without a single
  # commit landing HERE, and nothing else would re-run this gate before the nightly.
  workflow_dispatch:

# Explicit least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  tap:
    uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@main
    with:
      plugin_slug: aws_core
      # Pinned deliberately. `main` means "whatever core is today", which turns an
      # unrelated core change into a surprise red here. Bump this on purpose.
      harness_ref: main
      boot_profile: ci/nightly.boot.json
